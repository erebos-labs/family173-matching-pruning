name: bounded-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Full normal replay and standalone CLI checks
        run: python verify_all.py
      - name: Optimized regression and independent oracle
        run: |
          python -O tests/run_tests.py
          python -O independent/checks.py
      - name: Final source integrity
        run: python verify_manifest.py
      - name: Partial combinatorial addendum and deterministic fixtures
        run: |
          python -B combinatorial-pruning/src/check_manifest.py
          python -B combinatorial-pruning/src/verify.py
          python -B combinatorial-pruning/src/reproduce.py
          python -B combinatorial-pruning/tests/decoder_mutations.py
          python -B combinatorial-pruning/independent/checks.py
      - name: Certified partial probes in normal and optimized Python
        run: |
          python -B combinatorial-pruning/src/replay_probes.py
          python -B -O combinatorial-pruning/src/replay_probes.py
          python -B -O combinatorial-pruning/src/verify.py
          python -B -O combinatorial-pruning/tests/decoder_mutations.py
          python -B -O combinatorial-pruning/independent/checks.py
      - name: Final additive package integrity
        run: |
          python -B combinatorial-pruning/src/check_manifest.py
          python verify_manifest.py
      - name: Constructive residual cover normal and optimized replay
        run: |
          python -B residual-cover/src/reproduce.py
          python -B -O residual-cover/src/reproduce.py
          python -B residual-cover/independent/checks.py
          python -B -O residual-cover/independent/checks.py
      - name: Final complete addendum integrity
        run: |
          python -B residual-cover/src/check_manifest.py
          python verify_manifest.py
